pluginManagement {
    includeBuild "build-logic/common"
    repositories {
        mavenCentral()
        gradlePluginPortal()
        if (new File(rootDir, 'private/build.gradle').exists()) {
            maven {
                name = "artifactory"
                url = uri("https://repox.jfrog.io/repox/sonarsource")
            }
        }
    }
}

plugins {
    id 'com.gradle.develocity' version '4.5.0'
}

develocity {
    server = 'https://develocity.sonar.build'
}

def isCI = System.getenv('CI') != null

buildCache {
    local {
        enabled = !isCI
    }
    remote(develocity.buildCache) {
        enabled = true
        push = isCI
    }
}

dependencyResolutionManagement {
    // slf4j is provided by SQ, SC or SL, should be aligned with sonar-plugin-api
    def slf4jApiVersion = '2.0.18'
    def pluginApiVersion = '13.8.0.4399'
    def sonarqubeVersion = '26.8.0.126808'
    // Sensor test fixtures moved out of sonar-plugin-api-impl into the scanner engine in SQ 26.x.
    // Pinned to the last release built for Java 17; 13.7+ requires Java 21.
    def scannerEngineVersion = '13.6.1.4395'
    def analyzerCommonsVersion = '2.30.0.5193'

    versionCatalogs {
        libs {
            library("sonar-plugin-api", "org.sonarsource.api.plugin", "sonar-plugin-api").version(pluginApiVersion)
            library("sonar-analyzer-commons", "org.sonarsource.analyzer-commons", "sonar-analyzer-commons").version(analyzerCommonsVersion)
            library("sonar-xml-parsing", "org.sonarsource.analyzer-commons", "sonar-xml-parsing").version(analyzerCommonsVersion)
            library("slf4j-api", "org.slf4j", "slf4j-api").version(slf4jApiVersion)
            library("logback-classic", "ch.qos.logback", "logback-classic").version("1.6.3")
            library("jsr305", "com.google.code.findbugs", "jsr305").version("3.0.2")
            library("minimal-json", "com.eclipsesource.minimal-json", "minimal-json").version("0.9.5")
            library("antlr4", "org.antlr","antlr4").version("4.13.2")
            library("commons-codec", "commons-codec", "commons-codec").version("1.22.1")
        }

        testLibs {
            library("sonar-analyzer-test-commons", "org.sonarsource.analyzer-commons", "sonar-analyzer-test-commons").version(analyzerCommonsVersion)
            library("sonar-plugin-api-impl", "org.sonarsource.sonarqube", "sonar-plugin-api-impl").version(sonarqubeVersion)
            library("sensor-test-fixtures", "org.sonarsource.scanner.engine", "sensor-test-fixtures").version(scannerEngineVersion)
            library("junit-jupiter-api", "org.junit.jupiter", "junit-jupiter-api").version("6.1.3")
            library("junit-jupiter-engine", "org.junit.jupiter", "junit-jupiter-engine").version("6.1.3")
            library("junit-platform-launcher", "org.junit.platform", "junit-platform-launcher").version("6.1.3")
            library("junit", "junit", "junit").version("4.13.2")
            library("mockito-core", "org.mockito", "mockito-core").version("5.23.0")
            library("assertj-core", "org.assertj", "assertj-core").version("3.27.7")
            library("classgraph", "io.github.classgraph", "classgraph").version("4.8.194")
        }
    }
}

rootProject.name = 'slang'

include 'slang-api'
include 'slang-testing'
include 'slang-antlr'
include 'slang-checks'
include 'slang-plugin'
include 'checkstyle-import'
